<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Playable Ads Portfolio</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent: #38bdf8;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
            padding: 2rem;
        }

        header {
            text-align: center;
            margin-bottom: 3rem;
            margin-top: 2rem;
        }

        header h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            color: var(--accent);
        }

        header p {
            color: var(--text-muted);
            font-size: 1.1rem;
        }

        .portfolio-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.5rem;
            max-width: 1200px;
            margin: 0 auto;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 1.5rem;
            text-decoration: none;
            color: var(--text-main);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            border: 1px solid rgba(255, 255, 255, 0.05);
            min-height: 140px;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
            border-color: var(--accent);
        }

        .card h2 {
            font-size: 1.25rem;
            margin-bottom: 0.5rem;
        }

        .play-btn {
            display: inline-block;
            margin-top: 1rem;
            color: var(--accent);
            font-weight: 600;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .card:hover .play-btn {
            text-decoration: underline;
        }

        /* Responsive */
        @media (max-width: 600px) {
            body {
                padding: 1rem;
            }
            header h1 {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>Playable Ads Hub</h1>
        <p>Interactive HTML5 Prototypes & Mechanics</p>
    </header>

    <main class="portfolio-grid">
        <a href="3dmatch/" class="card">

            <span class="play-btn">Play Ad →</span>
        </a>

        <a href="AwayOut/" class="card">
            <h2>Away Out</h2>
            <span class="play-btn">Play Ad →</span>
        </a>

        <a href="BlockBlast1/" class="card">
            <h2>Block Blast 1</h2>
            <span class="play-btn">Play Ad →</span>
        </a>

        <a href="Example/" class="card">
            <h2>Example</h2>
            <span class="play-btn">Play Ad →</span>
        </a>

        <a href="FruitMerge/" class="card">
            <h2>Fruit Merge</h2>
            <span class="play-btn">Play Ad →</span>
        </a>

        <a href="MergeCocktails/" class="card">
            <h2>Merge Cocktails</h2>
